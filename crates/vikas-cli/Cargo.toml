[package]
name = "vikas-cli"
version = "1.0.0"
edition = "2021"

[dependencies]
vikas-kdb = { path = "../vikas-kdb" }
vikas-linux = { path = "../vikas-linux" }
vikas-physics = { path = "../vikas-physics" }
vikas-sim = { path = "../vikas-sim" }
vikas-wave = { path = "../vikas-wave" }
vikas-wcp = { path = "../vikas-wcp" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
rayon = "1"

[[bin]]
name = "vikas"
path = "src/main.rs"
