[package]
name = "vikas-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Analytical energy and mixed-signal physics models for VIKAS"
keywords = ["eda", "physics", "simulation", "electronics", "hardware"]
categories = ["science", "simulation"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vikas-wave = { path = "../vikas-wave", version = "3.0.0" }

[build-dependencies]
cc = "1"
