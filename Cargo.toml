[workspace]
resolver = "2"
members = [
    "crates/vikas-linux",
    "crates/vikas-kdb",
    "crates/vikas-physics",
    "crates/vikas-wave",
    "crates/vikas-wcp",
    "crates/vikas-sim",
    "crates/vikas-cli",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ginnela-sairam/Vikas"
homepage = "https://github.com/ginnela-sairam/Vikas"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
