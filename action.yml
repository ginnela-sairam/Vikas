name: VIKAS CLI
description: Build the VIKAS CLI and run one command
author: Ginnela Someswara Sai Ram Prasad
inputs:
  command:
    description: One VIKAS CLI command name, such as version or audit-7x
    required: false
    default: version
  args:
    description: Optional CLI arguments, with one argument per line (spaces within an argument are preserved)
    required: false
    default: ""
  workdir:
    description: Working directory in the caller repository
    required: false
    default: .
branding:
  icon: cpu
  color: blue
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build VIKAS CLI
      shell: bash
      run: cargo build --release --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
    - name: Run VIKAS command
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        VIKAS_COMMAND: ${{ inputs.command }}
        VIKAS_ARGS_RAW: ${{ inputs.args }}
      run: |
        case "$VIKAS_COMMAND" in
          ''|*[!a-z0-9-]*)
            echo "command must be a single lowercase CLI command name" >&2
            exit 2
            ;;
        esac

        args=()
        if [[ -n "$VIKAS_ARGS_RAW" ]]; then
          while IFS= read -r arg || [[ -n "$arg" ]]; do
            [[ -z "$arg" ]] && continue
            args+=("$arg")
          done <<< "$VIKAS_ARGS_RAW"
        fi

        "$GITHUB_ACTION_PATH/target/release/vikas" "$VIKAS_COMMAND" "${args[@]}"
