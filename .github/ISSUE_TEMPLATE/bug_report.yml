name: Bug report
description: Report a reproducible problem with VIKAS
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please do not include secrets or proprietary design files.
  - type: input
    id: version
    attributes:
      label: VIKAS version
      placeholder: "For example, the output of `vikas version`"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example or command, and redact sensitive data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
