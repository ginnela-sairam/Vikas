name: Build and publish VIKAS release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build VIKAS CLI
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist-bin
          cp "target/${{ matrix.target }}/release/vikas" dist-bin/
          cp README.md vikas.toml dist-bin/
          tar -czf "vikas-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C dist-bin .
      - name: Upload archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vikas-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
