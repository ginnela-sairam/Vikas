name: VIKAS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  exec-bits:
    name: exec-bits (friend-proof scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify executable bits on shell scripts
        run: |
          for f in *.sh; do
            [ -f "$f" ] || continue
            sed -i 's/\r$//' "$f"
            chmod +x "$f"
            bash -n "$f" || { echo "FAIL: $f has bash syntax error"; exit 1; }
            test -x "$f" || { echo "FAIL: $f is not executable"; exit 1; }
          done

  kernel:
    name: kernel (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Unit Tests
        run: |
          cargo build --release
          cargo test --release

  matrix:
    name: matrix (85-check command sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 85-check matrix
        run: |
          cargo build --release
          bash test_matrix.sh

  proof:
    name: proof (NOVA-SoC + goldens + signoff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Run NOVA-SoC + Goldens + Signoff Proof
        run: |
          cargo build --release
          VIKAS=./target/release/vikas
          "$VIKAS" version
          "$VIKAS" doctor
          "$VIKAS" run examples/multifile_proj/project.f | grep -q "result=200"
          "$VIKAS" run examples/polyglot_ai_cluster/cluster.f --max-ns 600 | grep -q "CLUSTER-PASS 6/6"
          "$VIKAS" run examples/nova_soc/nova.f --max-ns 8000 | grep -q "NOVA-PASS 9/9"
          "$VIKAS" signoff examples/nova_soc/nova.f --max-ns 8000
          rc=0; "$VIKAS" latch examples/demo_latch_trap.sv || rc=$?
          test "$rc" -eq 2
          "$VIKAS" latch examples/demo_fsm_uart.sv
          "$VIKAS" compile-all
          "$VIKAS" multicore --threads 16
          "$VIKAS" uvm --threads 16
          "$VIKAS" agentic examples/nova_soc/nova.f --epochs 5
          "$VIKAS" circt examples/polyglot_ai_cluster/cluster.f
          "$VIKAS" horizon --vdd 0.7 --tiers 3 --cpo 16
          "$VIKAS" audit-7x
          "$VIKAS" studio examples/nova_soc/nova.f -o /tmp/nova_studio.bundle --no-open
          test -s /tmp/nova_studio.bundle

  airgap:
    name: airgap (offline build — zero network, vendored deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the build needs ZERO network (fresh cargo home)
        run: |
          export CARGO_HOME="$RUNNER_TEMP/fresh_cargo_home"
          cargo build --release --locked --offline
          VIKAS=./target/release/vikas
          "$VIKAS" version
          "$VIKAS" doctor
          "$VIKAS" run examples/multifile_proj/project.f | grep -q "result=200"
          "$VIKAS" run examples/nova_soc/nova.f --max-ns 8000 | grep -q "NOVA-PASS 9/9"

  msrv:
    name: msrv (Rust 1.70 — oldest supported toolchain, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + smoke on Rust 1.70 with vendored deps
        run: |
          rustup toolchain install 1.70.0 --profile minimal --no-self-update
          export CARGO_HOME="$RUNNER_TEMP/fresh_cargo_home"
          cargo +1.70.0 build --release --locked --offline
          ./target/release/vikas version
          ./target/release/vikas doctor
          ./target/release/vikas run examples/multifile_proj/project.f | grep -q "result=200"