name: Retire stale GitHub Pages deployment

on:
  push:
    branches: [main]

permissions:
  deployments: write

jobs:
  retire-stale-deployment:
    if: contains(github.event.head_commit.message, 'cleanup stale Pages deployment')
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete Pages deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method DELETE "repos/${GH_REPO}/deployments/7828514707"
      - name: Verify deployment record was removed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${GH_REPO}/deployments" --jq '.[].id' | grep -Fxq '7828514707'; then
            echo "Stale deployment record still exists." >&2
            exit 1
          fi
